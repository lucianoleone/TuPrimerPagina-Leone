{% extends "base.html" %}

{% block titulo %}
Crear Centro de Trabajo
{% endblock titulo %}

{% block contenido %}

<h2 style="margin-bottom: 20px;">Crear Centro de Trabajo</h2>

<form action="{% url 'crear_centro' %}" method="POST" enctype="multipart/form-data" 
    style="display: flex; flex-direction: column; gap: 15px;">

    {% csrf_token %}

    {{ formulario.as_p }}

    <button type="submit" style="
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 1em;
        cursor: pointer;
        margin-top: 10px;
    ">
        Crear Centro
    </button>

</form>

{% endblock contenido %}
