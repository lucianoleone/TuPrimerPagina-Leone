{% extends "base.html" %}

{% block titulo %}
Editar Centro – {{ centro.nombre }}
{% endblock titulo %}

{% block contenido %}
<h2>Editar Centro de Trabajo</h2>

<form method="POST" enctype="multipart/form-data" style="display:flex; flex-direction:column; gap:15px;">
    {% csrf_token %}
    {{ formulario.as_p }}

    <button type="submit" style="background:#007bff; color:white; padding:10px; border-radius:6px; border:none;">
        Guardar Cambios
    </button>
</form>
{% endblock contenido %}
